FactoryBriefing=行动代号：锈蚀车间\n\n城郊北区的老机械厂已经停产六年，最近三个月却有人在夜里进出。线报称，有团伙在厂内私改枪械，并从装卸区往外出货。\n\n今晚 02:00 突入。找到他们的账本，人员能控制就控制。\n\n厂区主电已断，只剩零星应急灯，注意夜视与手电的使用。\n\n取得账本后，到厂区外撤离点集合。
